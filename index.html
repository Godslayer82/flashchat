<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JacksonChat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #111;
      --surface2: #161616;
      --border: #1e1e1e;
      --border2: #2a2a2a;
      --text: #ececec;
      --muted: #4a4a4a;
      --muted2: #666;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', monospace;
      font-size: 13px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ───── AUTH ───── */
    #auth-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-top: 30vh;
      width: 100%;
      max-width: 300px;
      padding: 0 16px;
    }
    #auth-screen h1 {
      font-size: 16px;
      letter-spacing: 8px;
      text-transform: uppercase;
      font-weight: normal;
    }
    #auth-screen p { color: var(--muted2); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; }
    .btn-google {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface); border: 1px solid var(--border2);
      color: var(--text); padding: 11px 20px; cursor: pointer;
      font-family: inherit; font-size: 12px; letter-spacing: 2px;
      text-transform: uppercase; width: 100%; justify-content: center;
      transition: border-color .15s, background .15s;
    }
    .btn-google:hover { border-color: #333; background: #161616; }

    /* ───── LAYOUT ───── */
    #app {
      display: none;
      width: 100%;
      max-width: 900px;
      height: 100vh;
      flex-direction: row;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 220px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #sidebar-top {
      padding: 18px 14px 14px;
      border-bottom: 1px solid var(--border);
    }
    #sidebar-top .logo {
      font-size: 11px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--muted2);
    }

    #nav-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .nav-tab {
      flex: 1; padding: 9px 0;
      text-align: center; font-size: 10px;
      letter-spacing: 1px; text-transform: uppercase;
      color: var(--muted); cursor: pointer;
      border: none; background: none; font-family: inherit;
      transition: color .15s;
      border-bottom: 1px solid transparent;
      margin-bottom: -1px;
    }
    .nav-tab:hover { color: var(--muted2); }
    .nav-tab.active { color: var(--text); border-bottom-color: var(--text); }

    .sidebar-panel { display: none; flex-direction: column; flex: 1; overflow-y: auto; }
    .sidebar-panel.active { display: flex; }

    /* Friends */
    .friend-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background .1s;
    }
    .friend-item:hover { background: var(--surface2); }
    .friend-item.active-chat { background: var(--surface2); }

    .friend-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--border2); border: 1px solid var(--border2);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; color: var(--muted2); flex-shrink: 0;
    }
    .friend-name { font-size: 12px; color: var(--text); }
    .list-empty { padding: 14px; font-size: 11px; color: var(--muted); letter-spacing: 1px; }

    /* Requests */
    .req-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; border-bottom: 1px solid var(--border);
    }
    .req-name { font-size: 12px; }
    .req-actions { display: flex; gap: 5px; }

    /* Profile */
    #tab-profile { padding: 16px 14px; gap: 16px; }
    .profile-top {
      display: flex; align-items: center; gap: 12px;
      padding-bottom: 14px; border-bottom: 1px solid var(--border);
    }
    .profile-avatar-lg {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--border2); border: 1px solid var(--border2);
      overflow: hidden; display: flex; align-items: center;
      justify-content: center; font-size: 16px; color: var(--muted2); flex-shrink: 0;
    }
    .profile-avatar-lg img { width: 100%; height: 100%; object-fit: cover; }
    .profile-uname { font-size: 13px; }
    .profile-email { font-size: 10px; color: var(--muted2); margin-top: 2px; word-break: break-all; }
    .field-label { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
    input.field {
      flex: 1; background: var(--surface); border: 1px solid var(--border2);
      color: var(--text); padding: 8px 10px; font-family: inherit;
      font-size: 12px; outline: none; transition: border-color .15s;
    }
    input.field:focus { border-color: #333; }
    input.field::placeholder { color: var(--muted); }

    /* Sidebar bottom */
    #sidebar-bottom { border-top: 1px solid var(--border); padding: 10px 14px; margin-top: auto; }

    /* ── Main ── */
    #main { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    #chat-header {
      padding: 0 18px;
      border-bottom: 1px solid var(--border);
      font-size: 12px; color: var(--muted2);
      height: 49px; display: flex; align-items: center; gap: 8px;
      flex-shrink: 0;
    }

    #add-friend-bar {
      display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    #add-friend-bar input {
      flex: 1; background: transparent; border: none;
      border-right: 1px solid var(--border); color: var(--text);
      padding: 10px 16px; font-family: inherit; font-size: 12px; outline: none;
    }
    #add-friend-bar input::placeholder { color: var(--muted); }

    #chat-area {
      flex: 1; overflow-y: auto;
      padding: 16px 20px; display: flex; flex-direction: column; gap: 6px;
    }
    #chat-area::-webkit-scrollbar { width: 3px; }
    #chat-area::-webkit-scrollbar-thumb { background: var(--border2); }

    .chat-placeholder {
      margin: auto; font-size: 11px; color: var(--muted);
      letter-spacing: 2px; text-align: center; line-height: 2.2;
    }

    .msg-row { display: flex; flex-direction: column; }
    .msg-row.me { align-items: flex-end; }
    .msg-row.them { align-items: flex-start; }
    .msg-sender { font-size: 10px; color: var(--muted2); margin-bottom: 3px; padding: 0 2px; }
    .msg-bubble {
      max-width: 70%; padding: 8px 12px;
      font-size: 13px; line-height: 1.5; word-break: break-word;
    }
    .msg-row.me .msg-bubble { background: var(--surface2); border: 1px solid var(--border2); }
    .msg-row.them .msg-bubble { background: transparent; border: 1px solid var(--border); }

    #input-bar { border-top: 1px solid var(--border); display: flex; flex-shrink: 0; }
    #msg-input {
      flex: 1; background: transparent; border: none;
      color: var(--text); padding: 14px 16px;
      font-family: inherit; font-size: 13px; outline: none;
    }
    #msg-input::placeholder { color: var(--muted); }
    #msg-input:disabled { opacity: .3; }

    /* Buttons */
    button.plain {
      background: none; border: 1px solid var(--border2); color: var(--muted2);
      padding: 5px 10px; cursor: pointer; font-family: inherit;
      font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
      transition: border-color .15s, color .15s;
    }
    button.plain:hover { border-color: #444; color: var(--text); }

    button.icon-btn {
      background: none; border: none; border-left: 1px solid var(--border);
      color: var(--muted2); padding: 0 18px; cursor: pointer;
      font-family: inherit; font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
      transition: color .15s, background .15s;
    }
    button.icon-btn:hover { color: var(--text); background: var(--surface2); }
    button.icon-btn:disabled { opacity: .3; cursor: default; }

    button.add-btn {
      background: none; border: none; border-left: 1px solid var(--border);
      color: var(--muted2); padding: 0 16px; cursor: pointer;
      font-family: inherit; font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
      transition: color .15s;
    }
    button.add-btn:hover { color: var(--text); }

    button.signout-btn {
      width: 100%; background: none; border: 1px solid var(--border);
      color: var(--muted); padding: 8px; cursor: pointer;
      font-family: inherit; font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
      transition: border-color .15s, color .15s;
    }
    button.signout-btn:hover { border-color: #333; color: var(--text); }

    /* Toast */
    #toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--surface2); border: 1px solid var(--border2);
      color: var(--muted2); padding: 8px 18px; font-size: 11px;
      letter-spacing: 1px; opacity: 0; pointer-events: none; transition: opacity .2s;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; }

    .sidebar-panel::-webkit-scrollbar { width: 3px; }
    .sidebar-panel::-webkit-scrollbar-thumb { background: var(--border2); }

    @media (max-width: 560px) {
      #sidebar { width: 150px; }
      .msg-bubble { max-width: 85%; }
    }
  </style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
  <h1>JacksonChat</h1>
  <p>sign in to continue</p>
  <button class="btn-google" onclick="signInWithGoogle()">
    <svg width="16" height="16" viewBox="0 0 48 48">
      <path fill="#4285F4" d="M44.5 20H24v8.5h11.8C34.7 33.9 29.9 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 6 1.1 8.2 3l6-6C34.6 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21c10.5 0 20-7.6 20-21 0-1.3-.2-2.7-.5-4z"/>
      <path fill="#34A853" d="M6.3 14.7l7 5.1C15 16.1 19.1 13 24 13c3.1 0 6 1.1 8.2 3l6-6C34.6 5.1 29.6 3 24 3 16.2 3 9.5 7.9 6.3 14.7z"/>
      <path fill="#FBBC05" d="M24 45c5.8 0 10.8-1.9 14.7-5.2l-6.8-5.6C29.9 36 27.1 37 24 37c-5.8 0-10.7-3.9-12.4-9.2l-7 5.4C8.1 40.5 15.4 45 24 45z"/>
      <path fill="#EA4335" d="M44.5 20H24v8.5h11.8c-1 3-3.3 5.5-6.3 7l6.8 5.6C40.9 37.5 45 31.5 45 24c0-1.3-.2-2.7-.5-4z"/>
    </svg>
    Sign in with Google
  </button>
</div>

<!-- APP -->
<div id="app">
  <div id="sidebar">
    <div id="sidebar-top"><span class="logo">JChat</span></div>

    <div id="nav-tabs">
      <button class="nav-tab active" onclick="switchTab('friends')">Friends</button>
      <button class="nav-tab" id="req-tab" onclick="switchTab('requests')">Requests</button>
      <button class="nav-tab" onclick="switchTab('profile')">Profile</button>
    </div>

    <!-- Friends panel -->
    <div id="tab-friends" class="sidebar-panel active">
      <div id="friends-list"><div class="list-empty">no friends yet</div></div>
    </div>

    <!-- Requests panel -->
    <div id="tab-requests" class="sidebar-panel">
      <div id="requests-list"><div class="list-empty">no requests</div></div>
    </div>

    <!-- Profile panel -->
    <div id="tab-profile" class="sidebar-panel">
      <div class="profile-top">
        <div class="profile-avatar-lg"><img id="profile-img" src="" alt="" /></div>
        <div>
          <div class="profile-uname" id="profile-uname"></div>
          <div class="profile-email" id="profile-email"></div>
        </div>
      </div>
      <div>
        <div class="field-label">Change username</div>
        <div style="display:flex;gap:6px">
          <input class="field" id="new-username" placeholder="new username" />
          <button class="plain" onclick="changeUsername()">Save</button>
        </div>
        <div id="uname-hint" style="font-size:10px;color:var(--muted);margin-top:6px;letter-spacing:1px">
          letters, numbers, underscores — 2 to 20 chars
        </div>
      </div>
    </div>

    <div id="sidebar-bottom">
      <button class="signout-btn" onclick="doSignOut()">Sign out</button>
    </div>
  </div>

  <div id="main">
    <div id="chat-header">
      <span id="chat-header-text" style="color:var(--muted);letter-spacing:1px">select a friend to chat</span>
    </div>

    <div id="add-friend-bar">
      <input type="text" id="friend-input" placeholder="add friend by username..." onkeydown="if(event.key==='Enter')sendRequest()" />
      <button class="add-btn" onclick="sendRequest()">+ Add</button>
    </div>

    <div id="chat-area">
      <div class="chat-placeholder">select a friend<br/>to start chatting</div>
    </div>

    <div id="input-bar">
      <input type="text" id="msg-input" placeholder="message..." disabled onkeydown="if(event.key==='Enter')sendMessage()" />
      <button class="icon-btn" id="send-btn" onclick="sendMessage()" disabled>Send</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-analytics.js";
  import {
    getAuth, GoogleAuthProvider, signInWithPopup,
    signOut as fbSignOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
  import {
    getFirestore, doc, setDoc, getDoc, updateDoc,
    arrayUnion, arrayRemove, collection, query, where,
    onSnapshot, addDoc, serverTimestamp, orderBy, getDocs
  } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAWBmQd-YuBmwwjSSyZz0qFVGoHA-t9QzI",
    authDomain: "jacksonchat.firebaseapp.com",
    projectId: "jacksonchat",
    storageBucket: "jacksonchat.firebasestorage.app",
    messagingSenderId: "908304460610",
    appId: "1:908304460610:web:526ef6cbcc5b760305f6db",
    measurementId: "G-BJNWLQ5D0R"
  };

  const app = initializeApp(firebaseConfig);
  getAnalytics(app);
  const auth = getAuth(app);
  const db   = getFirestore(app);

  let currentUser  = null;
  let myUsername   = '';
  let activeFriend = null;
  let chatUnsub    = null;
  let userUnsub    = null;

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), 2500);
  }

  // ── Auth ──
  window.signInWithGoogle = async () => {
    try { await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch(e) { toast(e.message); }
  };
  window.doSignOut = () => fbSignOut(auth);

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      const uid = user.uid;
      const ref  = doc(db, 'users', uid);
      const snap = await getDoc(ref);

      if (!snap.exists()) {
        myUsername = (user.displayName || user.email.split('@')[0]).replace(/\s+/g,'_');
        await setDoc(ref, {
          uid, username: myUsername,
          email: user.email, photo: user.photoURL||'',
          friends: [], requests: []
        });
      } else {
        myUsername = snap.data().username;
      }

      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      refreshProfileUI();
      startUserListener(uid);
    } else {
      currentUser = null; myUsername = ''; activeFriend = null;
      if (chatUnsub) chatUnsub();
      if (userUnsub) userUnsub();
      document.getElementById('auth-screen').style.display = 'flex';
      document.getElementById('app').style.display = 'none';
    }
  });

  function refreshProfileUI() {
    document.getElementById('profile-uname').textContent = myUsername;
    document.getElementById('profile-email').textContent = currentUser.email;
    const img = document.getElementById('profile-img');
    if (currentUser.photoURL) { img.src = currentUser.photoURL; }
    else { img.style.display = 'none'; }
  }

  // ── Live listener ──
  function startUserListener(uid) {
    if (userUnsub) userUnsub();
    userUnsub = onSnapshot(doc(db, 'users', uid), snap => {
      const d = snap.data() || {};
      renderFriends(d.friends || []);
      renderRequests(d.requests || []);
    });
  }

  function renderFriends(friends) {
    const list = document.getElementById('friends-list');
    if (!friends.length) {
      list.innerHTML = '<div class="list-empty">no friends yet</div>'; return;
    }
    list.innerHTML = '';
    friends.forEach(f => {
      const div = document.createElement('div');
      div.className = 'friend-item' + (activeFriend === f ? ' active-chat' : '');
      div.innerHTML = `
        <div class="friend-avatar">${esc(f.charAt(0).toUpperCase())}</div>
        <span class="friend-name">${esc(f)}</span>
      `;
      div.onclick = () => openChat(f);
      list.appendChild(div);
    });
  }

  function renderRequests(reqs) {
    const tab = document.getElementById('req-tab');
    tab.textContent = reqs.length ? `Req (${reqs.length})` : 'Requests';
    const list = document.getElementById('requests-list');
    if (!reqs.length) {
      list.innerHTML = '<div class="list-empty">no requests</div>'; return;
    }
    list.innerHTML = '';
    reqs.forEach(r => {
      const div = document.createElement('div');
      div.className = 'req-item';
      div.innerHTML = `
        <span class="req-name">${esc(r)}</span>
        <div class="req-actions">
          <button class="plain" data-u="${esc(r)}" data-a="accept">Accept</button>
          <button class="plain" data-u="${esc(r)}" data-a="decline">Decline</button>
        </div>
      `;
      div.querySelectorAll('button').forEach(btn => {
        btn.onclick = () => btn.dataset.a === 'accept' ? acceptReq(r) : declineReq(r);
      });
      list.appendChild(div);
    });
  }

  // ── Add friend ──
  window.sendRequest = async () => {
    const toUsername = document.getElementById('friend-input').value.trim();
    if (!toUsername) return;
    if (toUsername === myUsername) { toast('Cannot add yourself.'); return; }
    const snap = await getDocs(query(collection(db,'users'), where('username','==',toUsername)));
    if (snap.empty) { toast('User not found.'); return; }
    await updateDoc(doc(db,'users',snap.docs[0].id), { requests: arrayUnion(myUsername) });
    toast(`Request sent to ${toUsername}.`);
    document.getElementById('friend-input').value = '';
  };

  async function acceptReq(fromUsername) {
    await updateDoc(doc(db,'users',currentUser.uid), {
      requests: arrayRemove(fromUsername), friends: arrayUnion(fromUsername)
    });
    // mutual add
    const snap = await getDocs(query(collection(db,'users'), where('username','==',fromUsername)));
    if (!snap.empty) {
      await updateDoc(doc(db,'users',snap.docs[0].id), { friends: arrayUnion(myUsername) });
    }
    toast(`Added ${fromUsername}.`);
  }
  window.acceptReq = acceptReq;

  async function declineReq(fromUsername) {
    await updateDoc(doc(db,'users',currentUser.uid), { requests: arrayRemove(fromUsername) });
    toast('Declined.');
  }
  window.declineReq = declineReq;

  // ── Open chat ──
  function openChat(friendName) {
    activeFriend = friendName;

    // highlight sidebar
    document.querySelectorAll('.friend-item').forEach(el => {
      el.classList.toggle('active-chat',
        el.querySelector('.friend-name')?.textContent === friendName);
    });

    document.getElementById('chat-header-text').innerHTML =
      `<span style="color:var(--muted)">chatting with</span>&nbsp;<span style="color:var(--text)">${esc(friendName)}</span>`;

    const msgInput = document.getElementById('msg-input');
    const sendBtn  = document.getElementById('send-btn');
    msgInput.disabled = false;
    sendBtn.disabled  = false;
    msgInput.focus();

    if (chatUnsub) chatUnsub();
    const roomId = [myUsername, friendName].sort().join('__');
    const q = query(collection(db,'chats',roomId,'messages'), orderBy('ts','asc'));

    chatUnsub = onSnapshot(q, snap => {
      const area = document.getElementById('chat-area');
      area.innerHTML = '';
      if (snap.empty) {
        area.innerHTML = '<div class="chat-placeholder">no messages yet</div>'; return;
      }
      snap.docs.forEach(d => {
        const data = d.data();
        const isMe = data.from === myUsername;
        const row  = document.createElement('div');
        row.className = 'msg-row ' + (isMe ? 'me' : 'them');
        row.innerHTML = `
          <div class="msg-sender">${esc(data.from)}</div>
          <div class="msg-bubble">${esc(data.msg)}</div>
        `;
        area.appendChild(row);
      });
      area.scrollTop = area.scrollHeight;
    });

    // Auto-switch to friends tab on mobile
    switchTab('friends');
  }
  window.openChat = openChat;

  // ── Send message ──
  window.sendMessage = async () => {
    if (!activeFriend) return;
    const input = document.getElementById('msg-input');
    const msg   = input.value.trim();
    if (!msg) return;
    input.value = '';
    const roomId = [myUsername, activeFriend].sort().join('__');
    await addDoc(collection(db,'chats',roomId,'messages'), {
      from: myUsername, msg, ts: serverTimestamp()
    });
  };

  // ── Change username ──
  window.changeUsername = async () => {
    const newName = document.getElementById('new-username').value.trim();
    if (!newName) { toast('Enter a username.'); return; }
    if (newName === myUsername) { toast('Same as current.'); return; }
    if (!/^[a-zA-Z0-9_]{2,20}$/.test(newName)) {
      toast('2–20 chars: letters, numbers, underscores only.'); return;
    }
    const snap = await getDocs(query(collection(db,'users'), where('username','==',newName)));
    if (!snap.empty) { toast('Username already taken.'); return; }

    await updateDoc(doc(db,'users',currentUser.uid), { username: newName });
    myUsername = newName;
    document.getElementById('profile-uname').textContent = newName;
    document.getElementById('new-username').value = '';
    toast('Username updated.');
  };

  // ── Tab switch ──
  window.switchTab = (tab) => {
    ['friends','requests','profile'].forEach((t, i) => {
      document.querySelectorAll('.nav-tab')[i].classList.toggle('active', t === tab);
      document.getElementById('tab-' + t).classList.toggle('active', t === tab);
    });
  };
</script>
</body>
</html>
