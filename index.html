<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JacksonChat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #111;
      --surface2: #161616;
      --border: #1e1e1e;
      --border2: #2a2a2a;
      --text: #ececec;
      --muted: #444;
      --muted2: #666;
      --online: #3a3;
      --owner-color: #c8a84b;
      --admin-color: #7a8fc8;
      --mod-color: #6ab08a;
      --member-color: #555;
    }

    body {
      background: var(--bg); color: var(--text);
      font-family: 'Courier New', monospace; font-size: 13px;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    }

    /* ── AUTH ── */
    #auth-screen {
      display: flex; flex-direction: column; align-items: center;
      gap: 20px; margin-top: 30vh; width: 100%; max-width: 300px; padding: 0 16px;
    }
    #auth-screen h1 { font-size: 16px; letter-spacing: 8px; text-transform: uppercase; font-weight: normal; }
    #auth-screen p { color: var(--muted2); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; }
    .btn-google {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface); border: 1px solid var(--border2);
      color: var(--text); padding: 11px 20px; cursor: pointer;
      font-family: inherit; font-size: 12px; letter-spacing: 2px;
      text-transform: uppercase; width: 100%; justify-content: center;
      transition: border-color .15s, background .15s;
    }
    .btn-google:hover { border-color: #333; background: #161616; }

    /* ── LAYOUT ── */
    #app { display: none; width: 100%; max-width: 960px; height: 100vh; flex-direction: row; }

    /* ── Sidebar ── */
    #sidebar {
      width: 230px; flex-shrink: 0;
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; height: 100vh;
    }
    #sidebar-top {
      padding: 16px 14px 13px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    #sidebar-top .logo { font-size: 11px; letter-spacing: 5px; text-transform: uppercase; color: var(--muted2); }
    #my-role-badge { font-size: 9px; letter-spacing: 1px; padding: 2px 6px; border: 1px solid; text-transform: uppercase; }

    #nav-tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap; }
    .nav-tab {
      flex: 1; padding: 8px 4px; text-align: center; font-size: 9px;
      letter-spacing: 1px; text-transform: uppercase; color: var(--muted);
      cursor: pointer; border: none; background: none; font-family: inherit;
      border-bottom: 1px solid transparent; margin-bottom: -1px; transition: color .15s;
      min-width: 0; white-space: nowrap;
    }
    .nav-tab:hover { color: var(--muted2); }
    .nav-tab.active { color: var(--text); border-bottom-color: var(--text); }

    .sidebar-panel { display: none; flex-direction: column; flex: 1; overflow-y: auto; }
    .sidebar-panel.active { display: flex; }
    .sidebar-panel::-webkit-scrollbar { width: 3px; }
    .sidebar-panel::-webkit-scrollbar-thumb { background: var(--border2); }

    /* Friend items */
    .friend-item {
      display: flex; align-items: center; gap: 9px;
      padding: 9px 12px; cursor: pointer;
      border-bottom: 1px solid var(--border); transition: background .1s;
    }
    .friend-item:hover { background: var(--surface2); }
    .friend-item.active-chat { background: var(--surface2); }

    .avatar-wrap { position: relative; flex-shrink: 0; }
    .friend-avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--border2); border: 1px solid var(--border2);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: var(--muted2); overflow: hidden;
    }
    .presence-dot {
      position: absolute; bottom: 0; right: 0;
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--muted); border: 2px solid var(--bg);
    }
    .presence-dot.online { background: var(--online); }

    .friend-info { flex: 1; min-width: 0; }
    .friend-name-row { display: flex; align-items: center; gap: 5px; }
    .friend-name { font-size: 12px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nickname-tag { font-size: 9px; color: var(--muted2); font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .role-pip {
      font-size: 8px; letter-spacing: 1px; padding: 1px 4px;
      border: 1px solid; text-transform: uppercase; flex-shrink: 0; white-space: nowrap;
    }
    .role-pip.owner     { color: var(--owner-color);  border-color: var(--owner-color); }
    .role-pip.admin     { color: var(--admin-color);   border-color: var(--admin-color); }
    .role-pip.moderator { color: var(--mod-color);     border-color: var(--mod-color); }
    .role-pip.member    { display: none; }
    .last-seen { font-size: 9px; color: var(--muted2); margin-top: 1px; }
    .list-empty { padding: 14px; font-size: 11px; color: var(--muted); letter-spacing: 1px; }

    /* Requests */
    .req-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; border-bottom: 1px solid var(--border);
    }
    .req-name { font-size: 12px; }
    .req-actions { display: flex; gap: 5px; }

    /* Discover / Quick Add */
    #tab-discover { gap: 0; }
    .discover-header {
      padding: 12px; border-bottom: 1px solid var(--border);
      font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted2);
      display: flex; align-items: center; justify-content: space-between;
    }
    .discover-refresh {
      background: none; border: 1px solid var(--border2); color: var(--muted2);
      padding: 3px 8px; cursor: pointer; font-family: inherit;
      font-size: 9px; letter-spacing: 1px; text-transform: uppercase;
      transition: color .15s, border-color .15s;
    }
    .discover-refresh:hover { color: var(--text); border-color: #444; }
    .discover-item {
      display: flex; align-items: center; gap: 9px;
      padding: 10px 12px; border-bottom: 1px solid var(--border);
    }
    .discover-info { flex: 1; min-width: 0; }
    .discover-name { font-size: 12px; }
    .discover-email { font-size: 9px; color: var(--muted2); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .quick-add-btn {
      background: none; border: 1px solid var(--border2); color: var(--muted2);
      padding: 4px 9px; cursor: pointer; font-family: inherit;
      font-size: 9px; letter-spacing: 1px; text-transform: uppercase;
      transition: color .15s, border-color .15s; flex-shrink: 0;
    }
    .quick-add-btn:hover { color: var(--text); border-color: #444; }
    .quick-add-btn.sent { color: var(--muted); border-color: var(--border); cursor: default; }
    .discover-search {
      width: 100%; background: transparent; border: none;
      border-bottom: 1px solid var(--border); color: var(--text);
      padding: 9px 12px; font-family: inherit; font-size: 12px; outline: none;
    }
    .discover-search::placeholder { color: var(--muted); }

    /* Profile */
    #tab-profile { padding: 14px 12px; gap: 14px; }
    .profile-top {
      display: flex; align-items: center; gap: 12px;
      padding-bottom: 12px; border-bottom: 1px solid var(--border);
    }
    .profile-avatar-lg {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--border2); border: 1px solid var(--border2);
      overflow: hidden; display: flex; align-items: center;
      justify-content: center; font-size: 16px; color: var(--muted2); flex-shrink: 0;
    }
    .profile-avatar-lg img { width: 100%; height: 100%; object-fit: cover; }
    .profile-uname { font-size: 13px; }
    .profile-email { font-size: 10px; color: var(--muted2); margin-top: 2px; word-break: break-all; }
    .profile-role-line { font-size: 10px; margin-top: 3px; }
    .field-label { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
    input.field {
      flex: 1; background: var(--surface); border: 1px solid var(--border2);
      color: var(--text); padding: 8px 10px; font-family: inherit;
      font-size: 12px; outline: none; transition: border-color .15s;
    }
    input.field:focus { border-color: #333; }
    input.field::placeholder { color: var(--muted); }

    /* Admin portal */
    #tab-admin { padding: 0; gap: 0; }
    .admin-section { padding: 12px; border-bottom: 1px solid var(--border); }
    .admin-title { font-size: 9px; letter-spacing: 4px; text-transform: uppercase; color: var(--muted2); margin-bottom: 10px; }
    .admin-user-row {
      padding: 8px 0; border-bottom: 1px solid var(--border);
    }
    .admin-user-row:last-child { border-bottom: none; }
    .admin-row-top { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
    .admin-uname { flex: 1; font-size: 11px; }
    .admin-email { font-size: 9px; color: var(--muted2); }
    .admin-controls { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
    select.role-select {
      background: var(--surface); border: 1px solid var(--border2);
      color: var(--text); font-family: inherit; font-size: 10px;
      padding: 3px 5px; outline: none; cursor: pointer;
    }
    input.nick-input {
      background: var(--surface); border: 1px solid var(--border2);
      color: var(--text); font-family: inherit; font-size: 10px;
      padding: 3px 6px; outline: none; width: 80px;
    }
    input.nick-input::placeholder { color: var(--muted); }
    button.small-btn {
      background: none; border: 1px solid var(--border2); color: var(--muted2);
      padding: 3px 7px; cursor: pointer; font-family: inherit;
      font-size: 9px; letter-spacing: 1px; text-transform: uppercase;
      transition: border-color .15s, color .15s; white-space: nowrap;
    }
    button.small-btn:hover { border-color: #444; color: var(--text); }

    /* Sidebar bottom */
    #sidebar-bottom { border-top: 1px solid var(--border); padding: 10px 12px; }

    /* ── Main ── */
    #main { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    #chat-header {
      padding: 0 18px; border-bottom: 1px solid var(--border);
      font-size: 12px; color: var(--muted2);
      height: 49px; display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    }
    #chat-header-presence { display: flex; align-items: center; gap: 5px; }
    #chat-header-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
    #chat-header-dot.online { background: var(--online); }
    #chat-header-lastseen { font-size: 10px; color: var(--muted2); }

    #add-friend-bar { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    #add-friend-bar input {
      flex: 1; background: transparent; border: none;
      border-right: 1px solid var(--border); color: var(--text);
      padding: 10px 16px; font-family: inherit; font-size: 12px; outline: none;
    }
    #add-friend-bar input::placeholder { color: var(--muted); }

    #chat-area { flex: 1; overflow-y: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 6px; }
    #chat-area::-webkit-scrollbar { width: 3px; }
    #chat-area::-webkit-scrollbar-thumb { background: var(--border2); }

    .chat-placeholder { margin: auto; font-size: 11px; color: var(--muted); letter-spacing: 2px; text-align: center; line-height: 2.2; }

    .msg-row { display: flex; flex-direction: column; }
    .msg-row.me { align-items: flex-end; }
    .msg-row.them { align-items: flex-start; }
    .msg-sender-row { display: flex; align-items: center; gap: 5px; margin-bottom: 3px; padding: 0 2px; }
    .msg-sender { font-size: 10px; color: var(--muted2); }
    .msg-nick { font-size: 9px; color: var(--muted); font-style: italic; }
    .msg-role-pip {
      font-size: 8px; padding: 1px 4px; border: 1px solid; text-transform: uppercase; letter-spacing: 1px;
    }
    .msg-role-pip.owner     { color: var(--owner-color);  border-color: var(--owner-color); }
    .msg-role-pip.admin     { color: var(--admin-color);   border-color: var(--admin-color); }
    .msg-role-pip.moderator { color: var(--mod-color);     border-color: var(--mod-color); }
    .msg-role-pip.member    { display: none; }
    .msg-bubble { max-width: 68%; padding: 8px 12px; font-size: 13px; line-height: 1.5; word-break: break-word; }
    .msg-row.me .msg-bubble { background: var(--surface2); border: 1px solid var(--border2); }
    .msg-row.them .msg-bubble { background: transparent; border: 1px solid var(--border); }

    #input-bar { border-top: 1px solid var(--border); display: flex; flex-shrink: 0; }
    #msg-input {
      flex: 1; background: transparent; border: none;
      color: var(--text); padding: 14px 16px; font-family: inherit; font-size: 13px; outline: none;
    }
    #msg-input::placeholder { color: var(--muted); }
    #msg-input:disabled { opacity: .3; }

    button.plain {
      background: none; border: 1px solid var(--border2); color: var(--muted2);
      padding: 5px 9px; cursor: pointer; font-family: inherit;
      font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
      transition: border-color .15s, color .15s;
    }
    button.plain:hover { border-color: #444; color: var(--text); }
    button.icon-btn {
      background: none; border: none; border-left: 1px solid var(--border);
      color: var(--muted2); padding: 0 18px; cursor: pointer;
      font-family: inherit; font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
      transition: color .15s, background .15s;
    }
    button.icon-btn:hover { color: var(--text); background: var(--surface2); }
    button.icon-btn:disabled { opacity: .3; cursor: default; }
    button.add-btn {
      background: none; border: none; border-left: 1px solid var(--border);
      color: var(--muted2); padding: 0 16px; cursor: pointer;
      font-family: inherit; font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
      transition: color .15s;
    }
    button.add-btn:hover { color: var(--text); }
    button.signout-btn {
      width: 100%; background: none; border: 1px solid var(--border);
      color: var(--muted); padding: 8px; cursor: pointer;
      font-family: inherit; font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
      transition: border-color .15s, color .15s;
    }
    button.signout-btn:hover { border-color: #333; color: var(--text); }

    #toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--surface2); border: 1px solid var(--border2);
      color: var(--muted2); padding: 8px 18px; font-size: 11px;
      letter-spacing: 1px; opacity: 0; pointer-events: none; transition: opacity .2s; white-space: nowrap;
    }
    #toast.show { opacity: 1; }

    #my-role-badge.role-owner    { color: var(--owner-color); border-color: var(--owner-color); }
    #my-role-badge.role-admin    { color: var(--admin-color); border-color: var(--admin-color); }
    #my-role-badge.role-moderator{ color: var(--mod-color);   border-color: var(--mod-color); }
    #my-role-badge.role-member   { color: var(--member-color); border-color: var(--member-color); }
  </style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
  <h1>JacksonChat</h1>
  <p>sign in to continue</p>
  <button class="btn-google" onclick="signInWithGoogle()">
    <svg width="16" height="16" viewBox="0 0 48 48">
      <path fill="#4285F4" d="M44.5 20H24v8.5h11.8C34.7 33.9 29.9 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 6 1.1 8.2 3l6-6C34.6 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21c10.5 0 20-7.6 20-21 0-1.3-.2-2.7-.5-4z"/>
      <path fill="#34A853" d="M6.3 14.7l7 5.1C15 16.1 19.1 13 24 13c3.1 0 6 1.1 8.2 3l6-6C34.6 5.1 29.6 3 24 3 16.2 3 9.5 7.9 6.3 14.7z"/>
      <path fill="#FBBC05" d="M24 45c5.8 0 10.8-1.9 14.7-5.2l-6.8-5.6C29.9 36 27.1 37 24 37c-5.8 0-10.7-3.9-12.4-9.2l-7 5.4C8.1 40.5 15.4 45 24 45z"/>
      <path fill="#EA4335" d="M44.5 20H24v8.5h11.8c-1 3-3.3 5.5-6.3 7l6.8 5.6C40.9 37.5 45 31.5 45 24c0-1.3-.2-2.7-.5-4z"/>
    </svg>
    Sign in with Google
  </button>
</div>

<!-- APP -->
<div id="app">
  <div id="sidebar">
    <div id="sidebar-top">
      <span class="logo">JChat</span>
      <span id="my-role-badge"></span>
    </div>

    <div id="nav-tabs">
      <button class="nav-tab active" onclick="switchTab('friends')">Friends</button>
      <button class="nav-tab" id="req-tab" onclick="switchTab('requests')">Req</button>
      <button class="nav-tab" onclick="switchTab('discover')">Discover</button>
      <button class="nav-tab" onclick="switchTab('profile')">Profile</button>
      <button class="nav-tab" id="admin-tab" onclick="switchTab('admin')" style="display:none">Admin</button>
    </div>

    <!-- Friends -->
    <div id="tab-friends" class="sidebar-panel active">
      <div id="friends-list"><div class="list-empty">no friends yet</div></div>
    </div>

    <!-- Requests -->
    <div id="tab-requests" class="sidebar-panel">
      <div id="requests-list"><div class="list-empty">no requests</div></div>
    </div>

    <!-- Discover / Quick Add -->
    <div id="tab-discover" class="sidebar-panel">
      <input class="discover-search" id="discover-search" placeholder="search users..." oninput="filterDiscover()" />
      <div class="discover-header">
        <span>People you may know</span>
        <button class="discover-refresh" onclick="loadDiscover()">↻ Refresh</button>
      </div>
      <div id="discover-list"><div class="list-empty">loading...</div></div>
    </div>

    <!-- Profile -->
    <div id="tab-profile" class="sidebar-panel">
      <div style="padding:14px 12px;display:flex;flex-direction:column;gap:14px;">
        <div class="profile-top">
          <div class="profile-avatar-lg"><img id="profile-img" src="" alt=""/></div>
          <div>
            <div class="profile-uname" id="profile-uname"></div>
            <div id="profile-nick-display" style="font-size:10px;color:var(--muted2);font-style:italic;margin-top:1px"></div>
            <div class="profile-email" id="profile-email"></div>
            <div class="profile-role-line" id="profile-role-line"></div>
          </div>
        </div>
        <div>
          <div class="field-label">Change username</div>
          <div style="display:flex;gap:6px">
            <input class="field" id="new-username" placeholder="new username" />
            <button class="plain" onclick="changeUsername()">Save</button>
          </div>
          <div style="font-size:10px;color:var(--muted);margin-top:5px;letter-spacing:1px">letters, numbers, underscores — 2–20 chars</div>
        </div>
        <div>
          <div class="field-label">Set nickname</div>
          <div style="display:flex;gap:6px">
            <input class="field" id="my-nickname" placeholder="display nickname" />
            <button class="plain" onclick="saveMyNickname()">Save</button>
          </div>
          <div style="font-size:10px;color:var(--muted);margin-top:5px;letter-spacing:1px">shown alongside your username</div>
        </div>
      </div>
    </div>

    <!-- Admin Portal -->
    <div id="tab-admin" class="sidebar-panel">
      <div class="admin-section">
        <div class="admin-title">Admin Portal — User Management</div>
        <div id="admin-user-list"><div class="list-empty">loading...</div></div>
      </div>
    </div>

    <div id="sidebar-bottom">
      <button class="signout-btn" onclick="doSignOut()">Sign out</button>
    </div>
  </div>

  <!-- Main chat -->
  <div id="main">
    <div id="chat-header">
      <span id="chat-header-text" style="color:var(--muted);letter-spacing:1px">select a friend to chat</span>
      <div id="chat-header-presence" style="display:none;align-items:center;gap:5px;">
        <div id="chat-header-dot"></div>
        <span id="chat-header-lastseen"></span>
      </div>
    </div>

    <div id="add-friend-bar">
      <input type="text" id="friend-input" placeholder="add friend by username..." onkeydown="if(event.key==='Enter')sendFriendRequest()" />
      <button class="add-btn" onclick="sendFriendRequest()">+ Add</button>
    </div>

    <div id="chat-area">
      <div class="chat-placeholder">select a friend<br/>to start chatting</div>
    </div>

    <div id="input-bar">
      <input type="text" id="msg-input" placeholder="message..." disabled onkeydown="if(event.key==='Enter')sendMessage()" />
      <button class="icon-btn" id="send-btn" onclick="sendMessage()" disabled>Send</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
  import { initializeApp }  from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
  import { getAnalytics }   from "https://www.gstatic.com/firebasejs/12.13.0/firebase-analytics.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut as fbSignOut, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, updateDoc, arrayUnion, arrayRemove,
           collection, query, where, onSnapshot, addDoc, serverTimestamp, orderBy, getDocs }
    from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

  // ── Hardcoded privileged emails ──
  const OWNER_EMAIL = 'boydj23@greyhigh.school.nz';
  const ADMIN_EMAIL = 'detlaffcameron@gmail.com';

  const firebaseConfig = {
    apiKey: "AIzaSyAWBmQd-YuBmwwjSSyZz0qFVGoHA-t9QzI",
    authDomain: "jacksonchat.firebaseapp.com",
    projectId: "jacksonchat",
    storageBucket: "jacksonchat.firebasestorage.app",
    messagingSenderId: "908304460610",
    appId: "1:908304460610:web:526ef6cbcc5b760305f6db",
    measurementId: "G-BJNWLQ5D0R"
  };

  const app  = initializeApp(firebaseConfig);
  getAnalytics(app);
  const auth = getAuth(app);
  const db   = getFirestore(app);

  let currentUser   = null;
  let myUsername    = '';
  let myRole        = 'member';
  let myNickname    = '';
  let activeFriend  = null;
  let chatUnsub     = null;
  let userUnsub     = null;
  let discoverCache = [];   // all users for discover panel

  // ── Helpers ──
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 2600);
  }
  const roleLabel = r => ({ owner:'Owner', admin:'Admin', moderator:'Moderator', member:'Member' }[r] || 'Member');
  const roleCss   = r => 'role-' + (r || 'member');

  function fmtLastSeen(ts) {
    if (!ts) return '';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    const diff = Date.now() - d.getTime();
    if (diff < 60000)    return 'just now';
    if (diff < 3600000)  return `${Math.floor(diff/60000)}m ago`;
    if (diff < 86400000) return `${Math.floor(diff/3600000)}h ago`;
    return d.toLocaleDateString();
  }
  const ONLINE_THRESHOLD = 3 * 60 * 1000;
  const isOnline = ts => {
    if (!ts) return false;
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return Date.now() - d.getTime() < ONLINE_THRESHOLD;
  };

  // ── Presence heartbeat ──
  let _hb;
  function heartbeat() {
    if (!currentUser) return;
    updateDoc(doc(db,'users',currentUser.uid), { lastSeen: serverTimestamp() }).catch(()=>{});
  }
  function startHeartbeat() {
    heartbeat(); clearInterval(_hb); _hb = setInterval(heartbeat, 60000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) heartbeat(); });
  }

  // ── Determine role for an email ──
  function pinnedRole(email) {
    if (email === OWNER_EMAIL) return 'owner';
    if (email === ADMIN_EMAIL) return 'admin';
    return null;
  }

  // ── Auth ──
  window.signInWithGoogle = async () => {
    try { await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch(e) { toast(e.message); }
  };
  window.doSignOut = async () => {
    if (currentUser) await updateDoc(doc(db,'users',currentUser.uid), { lastSeen: serverTimestamp() }).catch(()=>{});
    fbSignOut(auth);
  };

  onAuthStateChanged(auth, async user => {
    if (user) {
      currentUser = user;
      const uid  = user.uid;
      const ref  = doc(db, 'users', uid);
      const snap = await getDoc(ref);

      // Determine role — pinned emails always get their fixed role
      const forced = pinnedRole(user.email);
      let role = forced || (snap.exists() ? snap.data().role || 'member' : 'member');

      if (!snap.exists()) {
        myUsername = (user.displayName || user.email.split('@')[0]).replace(/\s+/g,'_');
        myNickname = '';
        await setDoc(ref, {
          uid, username: myUsername, email: user.email,
          photo: user.photoURL||'', friends:[], requests:[],
          role, nickname: '', lastSeen: serverTimestamp()
        });
      } else {
        myUsername = snap.data().username;
        myNickname = snap.data().nickname || '';
        // Enforce pinned role if needed
        if (forced && snap.data().role !== forced) {
          await updateDoc(ref, { role: forced });
        }
      }
      myRole = role;

      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      refreshProfileUI();
      showAdminTabIfEligible();
      startUserListener(uid);
      startHeartbeat();
    } else {
      currentUser = null; myUsername = ''; myRole = 'member'; myNickname = ''; activeFriend = null;
      if (chatUnsub)  chatUnsub();
      if (userUnsub)  userUnsub();
      clearInterval(_hb);
      document.getElementById('auth-screen').style.display = 'flex';
      document.getElementById('app').style.display = 'none';
    }
  });

  function refreshProfileUI() {
    document.getElementById('profile-uname').textContent = myUsername;
    document.getElementById('profile-email').textContent = currentUser.email;
    const nickDisplay = document.getElementById('profile-nick-display');
    nickDisplay.textContent = myNickname ? `"${myNickname}"` : '';
    document.getElementById('my-nickname').value = myNickname;
    const rl = document.getElementById('profile-role-line');
    rl.textContent = roleLabel(myRole);
    rl.className = 'profile-role-line ' + roleCss(myRole);
    const img = document.getElementById('profile-img');
    if (currentUser.photoURL) img.src = currentUser.photoURL; else img.style.display = 'none';
    const badge = document.getElementById('my-role-badge');
    badge.textContent = roleLabel(myRole);
    badge.className = roleCss(myRole);
    badge.style.cssText = 'font-size:9px;letter-spacing:1px;padding:2px 6px;border:1px solid;text-transform:uppercase;';
  }

  function showAdminTabIfEligible() {
    const tab = document.getElementById('admin-tab');
    if (myRole === 'owner' || myRole === 'admin') tab.style.display = '';
    else tab.style.display = 'none';
  }

  // ── Live user listener (own doc) ──
  function startUserListener(uid) {
    if (userUnsub) userUnsub();
    userUnsub = onSnapshot(doc(db,'users',uid), snap => {
      const d = snap.data() || {};
      // Sync role if changed externally (but not for pinned emails)
      if (!pinnedRole(currentUser.email) && d.role && d.role !== myRole) {
        myRole = d.role;
        refreshProfileUI();
        showAdminTabIfEligible();
      }
      // Sync nickname if force-changed by admin
      const serverNick = d.nickname || '';
      if (serverNick !== myNickname) {
        myNickname = serverNick;
        refreshProfileUI();
        if (serverNick) toast(`An admin set your nickname to "${serverNick}"`);
      }
      renderFriends(d.friends || []);
      renderRequests(d.requests || []);
    });
  }

  // ── Friends list ──
  async function renderFriends(friends) {
    const list = document.getElementById('friends-list');
    if (!friends.length) { list.innerHTML = '<div class="list-empty">no friends yet</div>'; return; }
    list.innerHTML = '';

    const infoMap = {};
    await Promise.all(friends.map(async f => {
      const s = await getDocs(query(collection(db,'users'), where('username','==',f)));
      if (!s.empty) {
        const d = s.docs[0].data();
        infoMap[f] = { online: isOnline(d.lastSeen), lastSeen: d.lastSeen, role: d.role||'member', nickname: d.nickname||'' };
      }
    }));

    friends.forEach(f => {
      const info = infoMap[f] || { online:false, lastSeen:null, role:'member', nickname:'' };
      const div  = document.createElement('div');
      div.className = 'friend-item' + (activeFriend === f ? ' active-chat' : '');
      div.innerHTML = `
        <div class="avatar-wrap">
          <div class="friend-avatar">${esc(f.charAt(0).toUpperCase())}</div>
          <div class="presence-dot ${info.online?'online':''}"></div>
        </div>
        <div class="friend-info">
          <div class="friend-name-row">
            <span class="friend-name">${esc(f)}</span>
            ${info.nickname ? `<span class="nickname-tag">"${esc(info.nickname)}"</span>` : ''}
            <span class="role-pip ${info.role}">${roleLabel(info.role)}</span>
          </div>
          <div class="last-seen">${info.online ? 'online' : (info.lastSeen ? fmtLastSeen(info.lastSeen) : '')}</div>
        </div>
      `;
      div.onclick = () => openChat(f, info);
      list.appendChild(div);
    });
  }

  // ── Requests ──
  function renderRequests(reqs) {
    const tab  = document.getElementById('req-tab');
    tab.textContent = reqs.length ? `Req(${reqs.length})` : 'Req';
    const list = document.getElementById('requests-list');
    if (!reqs.length) { list.innerHTML = '<div class="list-empty">no requests</div>'; return; }
    list.innerHTML = '';
    reqs.forEach(r => {
      const div = document.createElement('div');
      div.className = 'req-item';
      div.innerHTML = `<span class="req-name">${esc(r)}</span><div class="req-actions"></div>`;
      const acts = div.querySelector('.req-actions');
      const ab = document.createElement('button'); ab.className='plain'; ab.textContent='Accept'; ab.onclick=()=>acceptReq(r);
      const db2 = document.createElement('button'); db2.className='plain'; db2.textContent='Decline'; db2.onclick=()=>declineReq(r);
      acts.appendChild(ab); acts.appendChild(db2);
      list.appendChild(div);
    });
  }

  // ── Add friend (manual) ──
  window.sendFriendRequest = async () => {
    const to = document.getElementById('friend-input').value.trim();
    if (!to) return;
    if (to === myUsername) { toast('Cannot add yourself.'); return; }
    const s = await getDocs(query(collection(db,'users'), where('username','==',to)));
    if (s.empty) { toast('User not found.'); return; }
    await updateDoc(doc(db,'users',s.docs[0].id), { requests: arrayUnion(myUsername) });
    toast(`Request sent to ${to}.`);
    document.getElementById('friend-input').value = '';
  };

  async function acceptReq(fromUsername) {
    await updateDoc(doc(db,'users',currentUser.uid), {
      requests: arrayRemove(fromUsername), friends: arrayUnion(fromUsername)
    });
    const s = await getDocs(query(collection(db,'users'), where('username','==',fromUsername)));
    if (!s.empty) await updateDoc(doc(db,'users',s.docs[0].id), { friends: arrayUnion(myUsername) });
    toast(`Added ${fromUsername}.`);
  }
  window.acceptReq = acceptReq;

  async function declineReq(fromUsername) {
    await updateDoc(doc(db,'users',currentUser.uid), { requests: arrayRemove(fromUsername) });
    toast('Declined.');
  }
  window.declineReq = declineReq;

  // ── Discover / Quick Add ──
  window.loadDiscover = async () => {
    document.getElementById('discover-list').innerHTML = '<div class="list-empty">loading...</div>';
    const snap = await getDocs(collection(db,'users'));
    // Get my current friends + requests sent
    const meSnap = await getDoc(doc(db,'users',currentUser.uid));
    const myFriends  = meSnap.data()?.friends || [];
    const myRequests = meSnap.data()?.requests || [];

    discoverCache = [];
    snap.docs.forEach(d => {
      const data = d.data();
      if (d.id === currentUser.uid) return;  // skip self
      discoverCache.push({ uid: d.id, ...data });
    });

    // Shuffle for "random" feel
    for (let i = discoverCache.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [discoverCache[i], discoverCache[j]] = [discoverCache[j], discoverCache[i]];
    }

    renderDiscover(discoverCache, myFriends);
  };

  function renderDiscover(users, myFriends) {
    const list  = document.getElementById('discover-list');
    const query = document.getElementById('discover-search').value.toLowerCase();
    const filtered = users.filter(u =>
      !query ||
      (u.username||'').toLowerCase().includes(query) ||
      (u.email||'').toLowerCase().includes(query)
    );

    if (!filtered.length) { list.innerHTML = '<div class="list-empty">no users found</div>'; return; }
    list.innerHTML = '';
    filtered.forEach(u => {
      const isFriend  = myFriends.includes(u.username);
      const div = document.createElement('div');
      div.className = 'discover-item';
      div.innerHTML = `
        <div class="avatar-wrap">
          <div class="friend-avatar" style="width:28px;height:28px;font-size:11px">${esc((u.username||'?').charAt(0).toUpperCase())}</div>
          <div class="presence-dot ${isOnline(u.lastSeen)?'online':''}"></div>
        </div>
        <div class="discover-info">
          <div class="discover-name">${esc(u.username||'unknown')} ${u.nickname ? `<span style="font-size:9px;color:var(--muted2);font-style:italic">"${esc(u.nickname)}"</span>` : ''}</div>
          <div class="discover-email">${esc(u.email||'')}</div>
        </div>
      `;
      const btn = document.createElement('button');
      btn.className = 'quick-add-btn' + (isFriend ? ' sent' : '');
      btn.textContent = isFriend ? 'Friends' : '+ Add';
      if (!isFriend) {
        btn.onclick = async () => {
          btn.textContent = 'Sent'; btn.className = 'quick-add-btn sent';
          await updateDoc(doc(db,'users',u.uid), { requests: arrayUnion(myUsername) });
          toast(`Request sent to ${u.username}.`);
        };
      }
      div.appendChild(btn);
      list.appendChild(div);
    });
  }

  window.filterDiscover = async () => {
    if (!discoverCache.length) { await window.loadDiscover(); return; }
    const meSnap    = await getDoc(doc(db,'users',currentUser.uid));
    const myFriends = meSnap.data()?.friends || [];
    renderDiscover(discoverCache, myFriends);
  };

  // ── Open chat ──
  function openChat(friendName, presenceInfo) {
    activeFriend = friendName;
    document.querySelectorAll('.friend-item').forEach(el => {
      el.classList.toggle('active-chat', el.querySelector('.friend-name')?.textContent === friendName);
    });

    const nick = presenceInfo?.nickname ? ` "${esc(presenceInfo.nickname)}"` : '';
    document.getElementById('chat-header-text').innerHTML =
      `<span style="color:var(--muted)">chatting with</span>&nbsp;<span style="color:var(--text)">${esc(friendName)}${nick}</span>`;

    if (presenceInfo) {
      const dot = document.getElementById('chat-header-dot');
      dot.className = presenceInfo.online ? 'online' : '';
      document.getElementById('chat-header-lastseen').textContent =
        presenceInfo.online ? 'online' : (presenceInfo.lastSeen ? 'last seen '+fmtLastSeen(presenceInfo.lastSeen) : '');
      document.getElementById('chat-header-presence').style.display = 'flex';
    }

    document.getElementById('msg-input').disabled = false;
    document.getElementById('send-btn').disabled  = false;
    document.getElementById('msg-input').focus();

    if (chatUnsub) chatUnsub();
    const roomId = [myUsername, friendName].sort().join('__');
    const q = query(collection(db,'chats',roomId,'messages'), orderBy('ts','asc'));
    let friendRole = presenceInfo?.role || 'member';

    chatUnsub = onSnapshot(q, snap => {
      const area = document.getElementById('chat-area');
      area.innerHTML = '';
      if (snap.empty) { area.innerHTML='<div class="chat-placeholder">no messages yet</div>'; return; }
      snap.docs.forEach(d => {
        const data  = d.data();
        const isMe  = data.from === myUsername;
        const role  = isMe ? myRole : (data.role || friendRole);
        const nick  = isMe ? myNickname : (presenceInfo?.nickname||'');
        const row   = document.createElement('div');
        row.className = 'msg-row ' + (isMe ? 'me' : 'them');
        row.innerHTML = `
          <div class="msg-sender-row">
            <span class="msg-sender">${esc(data.from)}</span>
            ${nick ? `<span class="msg-nick">"${esc(nick)}"</span>` : ''}
            <span class="msg-role-pip ${role}">${roleLabel(role)}</span>
          </div>
          <div class="msg-bubble">${esc(data.msg)}</div>
        `;
        area.appendChild(row);
      });
      area.scrollTop = area.scrollHeight;
    });
  }
  window.openChat = openChat;

  // ── Send message ──
  window.sendMessage = async () => {
    if (!activeFriend) return;
    const input = document.getElementById('msg-input');
    const msg   = input.value.trim();
    if (!msg) return;
    input.value = '';
    const roomId = [myUsername, activeFriend].sort().join('__');
    await addDoc(collection(db,'chats',roomId,'messages'), {
      from: myUsername, role: myRole, msg, ts: serverTimestamp()
    });
    heartbeat();
  };

  // ── Change username (own) ──
  window.changeUsername = async () => {
    const newName = document.getElementById('new-username').value.trim();
    if (!newName) { toast('Enter a username.'); return; }
    if (newName === myUsername) { toast('Same as current.'); return; }
    if (!/^[a-zA-Z0-9_]{2,20}$/.test(newName)) { toast('2–20 chars: letters, numbers, underscores.'); return; }
    const s = await getDocs(query(collection(db,'users'), where('username','==',newName)));
    if (!s.empty) { toast('Username already taken.'); return; }
    await updateDoc(doc(db,'users',currentUser.uid), { username: newName });
    myUsername = newName;
    document.getElementById('profile-uname').textContent = newName;
    document.getElementById('new-username').value = '';
    toast('Username updated.');
  };

  // ── Save own nickname ──
  window.saveMyNickname = async () => {
    const nick = document.getElementById('my-nickname').value.trim().slice(0, 30);
    await updateDoc(doc(db,'users',currentUser.uid), { nickname: nick });
    myNickname = nick;
    document.getElementById('profile-nick-display').textContent = nick ? `"${nick}"` : '';
    toast(nick ? `Nickname set to "${nick}".` : 'Nickname cleared.');
  };

  // ── Admin portal ──
  async function loadAdminPanel() {
    const snap = await getDocs(collection(db,'users'));
    const list = document.getElementById('admin-user-list');
    list.innerHTML = '';

    const canAssignRoles = myRole === 'owner'
      ? ['member','moderator','admin']
      : ['member','moderator'];

    snap.docs.forEach(d => {
      const data = d.data();
      const uid  = d.id;
      const currentRole = data.role || 'member';
      const isOwnerRow  = data.email === OWNER_EMAIL;
      const isAdminRow  = data.email === ADMIN_EMAIL;
      // Only owner can edit admin; no one can edit owner
      const editable = !isOwnerRow && (myRole === 'owner' || !isAdminRow);

      const row = document.createElement('div');
      row.className = 'admin-user-row';

      let controlsHTML = '';
      if (isOwnerRow) {
        controlsHTML = `<span class="role-pip owner" style="font-size:9px;padding:2px 5px">Owner</span>`;
      } else if (!editable) {
        controlsHTML = `<span class="role-pip admin" style="font-size:9px;padding:2px 5px">Admin</span>`;
      } else {
        controlsHTML = `
          <div class="admin-controls">
            <select class="role-select" id="sel-${uid}">
              ${canAssignRoles.map(r=>`<option value="${r}" ${r===currentRole?'selected':''}>${roleLabel(r)}</option>`).join('')}
            </select>
            <button class="small-btn" onclick="applyRole('${uid}','${esc(data.username)}')">Role</button>
            <input class="nick-input" id="nick-${uid}" placeholder="force nick" value="${esc(data.nickname||'')}" maxlength="30" />
            <button class="small-btn" onclick="forceNickname('${uid}','${esc(data.username)}')">Nick</button>
          </div>
        `;
      }

      row.innerHTML = `
        <div class="admin-row-top">
          <div class="admin-uname">
            ${esc(data.username||'—')}
            ${data.nickname ? `<span class="msg-nick" style="font-size:9px;color:var(--muted2)"> "${esc(data.nickname)}"</span>` : ''}
          </div>
          <span class="admin-email">${esc(data.email||'')}</span>
        </div>
        ${controlsHTML}
      `;
      list.appendChild(row);
    });
  }
  window.loadAdminPanel = loadAdminPanel;

  window.applyRole = async (uid, username) => {
    const sel = document.getElementById('sel-'+uid);
    if (!sel) return;
    // Prevent demoting pinned admin via portal (double-check)
    const targetSnap = await getDoc(doc(db,'users',uid));
    if (targetSnap.data()?.email === ADMIN_EMAIL && myRole !== 'owner') {
      toast('Only the owner can change that user\'s role.'); return;
    }
    await updateDoc(doc(db,'users',uid), { role: sel.value });
    toast(`${username} is now ${roleLabel(sel.value)}.`);
  };

  window.forceNickname = async (uid, username) => {
    const input = document.getElementById('nick-'+uid);
    if (!input) return;
    const nick = input.value.trim().slice(0,30);
    await updateDoc(doc(db,'users',uid), { nickname: nick });
    toast(nick ? `Set ${username}'s nickname to "${nick}".` : `Cleared ${username}'s nickname.`);
  };

  // ── Tab switch ──
  const ALL_TABS = ['friends','requests','discover','profile','admin'];
  window.switchTab = tab => {
    ALL_TABS.forEach(t => {
      const btn   = document.getElementById(`tab-btn-${t}`);
      const panel = document.getElementById('tab-'+t);
      if (panel) panel.classList.toggle('active', t === tab);
    });
    document.querySelectorAll('.nav-tab').forEach((el,i) => {
      el.classList.toggle('active', ALL_TABS[i] === tab);
    });
    if (tab === 'admin')   loadAdminPanel();
    if (tab === 'discover') window.loadDiscover();
  };
</script>
</body>
</html>
